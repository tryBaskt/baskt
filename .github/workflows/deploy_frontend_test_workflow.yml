name: Deploy Test Frontend to S3 and CloudFront

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-test-frontend:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: test
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      FRONTEND_BUCKET_NAME: test-frontend-v4
      FRONTEND_DOMAIN_NAME: test.trybaskt.com
      TF_VAR_trade_worker_image_uri: not-used-for-frontend-targeted-apply

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: |
          terraform -chdir=infrastructure_terraform/test init \
            -backend-config="bucket=trybaskt-terraform-state-499133675835" \
            -backend-config="key=baskt/test/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Provision frontend hosting
        run: |
          terraform -chdir=infrastructure_terraform/test plan \
            -target=module.frontend_hosting \
            -out=tfplan \
            -no-color

          terraform -chdir=infrastructure_terraform/test apply -auto-approve tfplan

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend_v4/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend_v4
        run: npm ci

      - name: Build test frontend
        working-directory: frontend_v4
        run: npm run build:test

      - name: Upload versioned frontend assets
        run: |
          aws s3 sync frontend_v4/dist "s3://${FRONTEND_BUCKET_NAME}" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload frontend entrypoint
        run: |
          aws s3 cp frontend_v4/dist/index.html "s3://${FRONTEND_BUCKET_NAME}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Resolve CloudFront distribution
        id: cloudfront
        run: |
          set -euo pipefail

          distribution_id="$(
            aws cloudfront list-distributions \
              --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '${FRONTEND_DOMAIN_NAME}')].Id | [0]" \
              --output text
          )"

          if [[ -z "$distribution_id" || "$distribution_id" == "None" ]]; then
            echo "Unable to find CloudFront distribution for ${FRONTEND_DOMAIN_NAME}." >&2
            exit 1
          fi

          echo "distribution_id=${distribution_id}" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cloudfront.outputs.distribution_id }}" \
            --paths "/*"
