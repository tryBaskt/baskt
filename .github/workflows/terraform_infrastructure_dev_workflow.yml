name: Deploy Dev Infrastructure with Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run for the dev environment
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy
      confirm_destroy_dev:
        description: Type DELETE_DEV to confirm permanent dev infrastructure deletion
        required: false
        type: string

concurrency:
  group: dev-aws-environment
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev-infrastructure:
    if: github.event.inputs.action == 'destroy' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_VAR_trade_worker_image_uri: ${{ github.event.inputs.action == 'destroy' && 'unused-for-dev-destroy' || vars.TF_VAR_trade_worker_image_uri }}
      TF_VAR_opensearch_endpoint_override: ${{ vars.TF_VAR_opensearch_endpoint_override }}
      TF_VAR_runtime_enabled: ${{ vars.TF_VAR_runtime_enabled || 'false' }}
      TF_VAR_trade_worker_environment: ${{ secrets.TF_VAR_trade_worker_environment }}
    defaults:
      run:
        working-directory: infrastructure_terraform/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity for infrastructure deployment
        run: aws sts get-caller-identity

      - name: Detect trade execution queue worker image changes
        id: trade-execution-queue-worker-changes
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$before" "${{ github.sha }}")"
          if echo "$changed_files" | grep -E '^(backend/|deployables/trade_execution_queue_worker/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive .

      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="bucket=trybaskt-terraform-state-499133675835" \
            -backend-config="key=baskt/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Confirm dev infrastructure destroy
        if: github.event.inputs.action == 'destroy' && github.event.inputs.confirm_destroy_dev != 'DELETE_DEV'
        run: |
          echo "Refusing to destroy dev infrastructure without confirm_destroy_dev=DELETE_DEV." >&2
          exit 1

      - name: Preflight dev IAM destroy permissions
        if: github.event.inputs.action == 'destroy' && github.event.inputs.confirm_destroy_dev == 'DELETE_DEV'
        run: |
          set -euo pipefail

          roles=(
            dev-baskt-account-search-indexer-role
            dev-model-portfolio-search-indexer-role
            dev-trade-execution-market-hours-controller-role
            dev-trade-execution-market-hours-scheduler-role
            dev-trade-execution-queue-worker-role
          )

          for role in "${roles[@]}"; do
            if aws iam get-role --role-name "$role" >/dev/null 2>&1; then
              aws iam list-instance-profiles-for-role --role-name "$role" >/dev/null
              aws iam list-attached-role-policies --role-name "$role" >/dev/null
              aws iam list-role-policies --role-name "$role" >/dev/null
            fi
          done

      - name: Disable Cognito deletion protection before destroy
        if: github.event.inputs.action == 'destroy' && github.event.inputs.confirm_destroy_dev == 'DELETE_DEV'
        run: terraform apply -target=module.cognito.aws_cognito_user_pool.baskt -auto-approve -no-color

      - name: Prepare trade execution queue worker image
        if: github.event.inputs.action == 'apply' && steps.trade-execution-queue-worker-changes.outputs.changed == 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          terraform -chdir=infrastructure_terraform/dev apply -target=module.ecr -auto-approve

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          repository_name="dev-trade-execution-queue-worker"
          repository_uri="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${repository_name}"
          image_uri="${repository_uri}:${GITHUB_SHA}"

          if aws ecr describe-images \
            --repository-name "$repository_name" \
            --image-ids imageTag="$GITHUB_SHA" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Image $image_uri already exists; reusing it."
            echo "TF_VAR_trade_worker_image_uri=$image_uri" >> "$GITHUB_ENV"
            exit 0
          fi

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          docker build \
            -f deployables/trade_execution_queue_worker/Dockerfile \
            -t "$image_uri" \
            .

          docker push "$image_uri"

          echo "TF_VAR_trade_worker_image_uri=$image_uri" >> "$GITHUB_ENV"

      - name: Resolve trade execution queue worker image URI
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          if [[ -n "${TF_VAR_trade_worker_image_uri:-}" ]]; then
            echo "Using configured trade worker image: $TF_VAR_trade_worker_image_uri"
            exit 0
          fi

          function_name="dev-trade-execution-queue-worker"
          image_uri="$(
            aws lambda get-function \
              --function-name "$function_name" \
              --region "$AWS_REGION" \
              --query 'Code.ImageUri' \
              --output text 2>/dev/null || true
          )"

          if [[ -n "$image_uri" && "$image_uri" != "None" ]]; then
            echo "Reusing current Lambda image: $image_uri"
            echo "TF_VAR_trade_worker_image_uri=$image_uri" >> "$GITHUB_ENV"
            exit 0
          fi

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          repository_name="dev-trade-execution-queue-worker"
          repository_uri="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${repository_name}"
          latest_tag="$(
            aws ecr describe-images \
              --repository-name "$repository_name" \
              --region "$AWS_REGION" \
              --filter tagStatus=TAGGED \
              --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[0]' \
              --output text 2>/dev/null || true
          )"

          if [[ -z "$latest_tag" || "$latest_tag" == "None" ]]; then
            echo "Unable to resolve a trade worker image URI. Build the worker image or set TF_VAR_trade_worker_image_uri." >&2
            exit 1
          fi

          image_uri="${repository_uri}:${latest_tag}"
          echo "Reusing latest ECR image: $image_uri"
          echo "TF_VAR_trade_worker_image_uri=$image_uri" >> "$GITHUB_ENV"

      - name: Plan dev infrastructure changes
        if: github.event.inputs.action == 'apply'
        run: terraform plan -out=tfplan -no-color

      - name: Plan dev infrastructure destroy
        if: github.event.inputs.action == 'destroy' && github.event.inputs.confirm_destroy_dev == 'DELETE_DEV'
        run: terraform plan -destroy -out=tfplan -no-color

      - name: Apply dev infrastructure changes
        if: github.event.inputs.action == 'apply' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))
        run: terraform apply -auto-approve tfplan

      - name: Destroy dev infrastructure
        if: github.event.inputs.action == 'destroy' && github.event.inputs.confirm_destroy_dev == 'DELETE_DEV'
        run: terraform apply -auto-approve tfplan

      - name: Refresh OpenSearch indices from DynamoDB
        if: github.event.inputs.action == 'apply' && env.TF_VAR_runtime_enabled == 'true' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))
        working-directory: ${{ github.workspace }}
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          python -m pip install boto3==1.42.34
          python infrastructure_terraform/refresh_search_indices.py --environment dev --region "$AWS_REGION"

      - name: Sync trade execution queue worker market-hours state
        if: github.event.inputs.action == 'apply' && env.TF_VAR_runtime_enabled == 'true' && steps.trade-execution-queue-worker-changes.outputs.changed == 'true' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))
        run: |
          aws lambda invoke \
            --function-name dev-trade-execution-market-hours-controller \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"sync"}' \
            market-hours-sync-response.json

          cat market-hours-sync-response.json
