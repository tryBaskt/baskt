name: Deploy Test Environment

on:
  workflow_dispatch:
    inputs:
      backend_test_mode:
        description: Backend test job to run after deployment
        required: true
        default: live_alpaca
        type: choice
        options:
          - live_alpaca
          - mock_alpaca

concurrency:
  group: test-aws-environment
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  deploy-test-infrastructure:
    if: github.ref == 'refs/heads/test' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: test
    outputs:
      test_cognito_region: ${{ steps.test-infrastructure-outputs.outputs.test_cognito_region }}
      test_cognito_user_pool_id: ${{ steps.test-infrastructure-outputs.outputs.test_cognito_user_pool_id }}
      test_cognito_app_client_id: ${{ steps.test-infrastructure-outputs.outputs.test_cognito_app_client_id }}
      test_trade_execution_queue_url: ${{ steps.test-infrastructure-outputs.outputs.test_trade_execution_queue_url }}
    env:
      TF_VAR_trade_worker_image_uri: ${{ vars.TF_VAR_trade_worker_image_uri }}
      TF_VAR_backend_image_uri: ${{ vars.TF_VAR_backend_image_uri }}
      TF_VAR_opensearch_endpoint_override: ${{ vars.TF_VAR_opensearch_endpoint_override }}
    defaults:
      run:
        working-directory: infrastructure_terraform/test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity for infrastructure deployment
        run: aws sts get-caller-identity

      - name: Detect trade execution queue worker image changes
        id: trade-execution-queue-worker-changes
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$before" "${{ github.sha }}")"
          if echo "$changed_files" | grep -E '^(backend/|deployables/trade_execution_queue_worker/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure sensitive Terraform variables
        env:
          SANDBOX_ALPACA_BROKER_API_KEY: ${{ secrets.SANDBOX_ALPACA_BROKER_API_KEY }}
          SANDBOX_ALPACA_BROKER_API_SECRET: ${{ secrets.SANDBOX_ALPACA_BROKER_API_SECRET }}
        run: |
          {
            echo "TF_VAR_trade_worker_environment<<EOF"
            jq -n \
              --arg sandbox_alpaca_broker_api_key "$SANDBOX_ALPACA_BROKER_API_KEY" \
              --arg sandbox_alpaca_broker_api_secret "$SANDBOX_ALPACA_BROKER_API_SECRET" \
              '{
                SANDBOX_ALPACA_BROKER_API_KEY: $sandbox_alpaca_broker_api_key,
                SANDBOX_ALPACA_BROKER_API_SECRET: $sandbox_alpaca_broker_api_secret
              }'
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive .

      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="bucket=trybaskt-terraform-state-499133675835" \
            -backend-config="key=baskt/test/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Prepare trade execution queue worker image
        if: steps.trade-execution-queue-worker-changes.outputs.changed == 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          terraform -chdir=infrastructure_terraform/test apply -target=module.ecr -auto-approve

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          repository_name="test-trade-execution-queue-worker"
          repository_uri="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${repository_name}"
          image_uri="${repository_uri}:${GITHUB_SHA}"

          if aws ecr describe-images \
            --repository-name "$repository_name" \
            --image-ids imageTag="$GITHUB_SHA" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Image $image_uri already exists; reusing it."
            echo "TF_VAR_trade_worker_image_uri=$image_uri" >> "$GITHUB_ENV"
            exit 0
          fi

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          docker build \
            -f deployables/trade_execution_queue_worker/Dockerfile \
            -t "$image_uri" \
            .

          docker push "$image_uri"

          echo "TF_VAR_trade_worker_image_uri=$image_uri" >> "$GITHUB_ENV"

      - name: Resolve trade execution queue worker image URI
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          if [[ -n "${TF_VAR_trade_worker_image_uri:-}" ]]; then
            echo "Using configured trade worker image: $TF_VAR_trade_worker_image_uri"
            exit 0
          fi

          function_name="test-trade-execution-queue-worker"
          image_uri="$(
            aws lambda get-function \
              --function-name "$function_name" \
              --region "$AWS_REGION" \
              --query 'Code.ImageUri' \
              --output text 2>/dev/null || true
          )"

          if [[ -n "$image_uri" && "$image_uri" != "None" ]]; then
            echo "Reusing current Lambda image: $image_uri"
            echo "TF_VAR_trade_worker_image_uri=$image_uri" >> "$GITHUB_ENV"
            exit 0
          fi

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          repository_name="test-trade-execution-queue-worker"
          repository_uri="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${repository_name}"
          latest_tag="$(
            aws ecr describe-images \
              --repository-name "$repository_name" \
              --region "$AWS_REGION" \
              --filter tagStatus=TAGGED \
              --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[0]' \
              --output text 2>/dev/null || true
          )"

          if [[ -z "$latest_tag" || "$latest_tag" == "None" ]]; then
            echo "Unable to resolve a trade worker image URI. Build the worker image or set TF_VAR_trade_worker_image_uri." >&2
            exit 1
          fi

          image_uri="${repository_uri}:${latest_tag}"
          echo "Reusing latest ECR image: $image_uri"
          echo "TF_VAR_trade_worker_image_uri=$image_uri" >> "$GITHUB_ENV"

      - name: Resolve current backend image URI
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          if [[ -n "${TF_VAR_backend_image_uri:-}" ]]; then
            echo "Using configured backend image: $TF_VAR_backend_image_uri"
            exit 0
          fi

          task_definition="$(
            aws ecs describe-services \
              --cluster test-backend \
              --services test-backend \
              --region "$AWS_REGION" \
              --query 'services[0].taskDefinition' \
              --output text 2>/dev/null || true
          )"

          if [[ -n "$task_definition" && "$task_definition" != "None" ]]; then
            image_uri="$(
              aws ecs describe-task-definition \
                --task-definition "$task_definition" \
                --region "$AWS_REGION" \
                --query 'taskDefinition.containerDefinitions[?name==`backend`].image | [0]' \
                --output text
            )"

            if [[ -n "$image_uri" && "$image_uri" != "None" ]]; then
              echo "Reusing current backend image: $image_uri"
              echo "TF_VAR_backend_image_uri=$image_uri" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          echo "No current backend ECS service image found; backend service will remain absent until backend deployment runs."

      - name: Plan test infrastructure changes
        run: terraform plan -out=tfplan -no-color

      - name: Apply test infrastructure changes
        if: github.ref == 'refs/heads/test' || github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan

      - name: Publish test infrastructure outputs for downstream deployments
        id: test-infrastructure-outputs
        if: github.ref == 'refs/heads/test' || github.event_name == 'workflow_dispatch'
        env:
          GH_VARIABLES_TOKEN: ${{ secrets.GH_VARIABLES_TOKEN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          outputs="$(terraform output -json)"
          cognito_user_pool_id="$(jq -r '.cognito_user_pool_id.value' <<< "$outputs")"
          cognito_app_client_id="$(jq -r '.cognito_app_client_id.value' <<< "$outputs")"
          trade_execution_queue_url="$(jq -r '.trade_execution_queue_url.value' <<< "$outputs")"
          cognito_domain_prefix="$(jq -r '.cognito_user_pool_domain.value' <<< "$outputs")"
          cognito_domain="${cognito_domain_prefix}.auth.${AWS_REGION}.amazoncognito.com"
          backend_custom_domain="$(jq -r '.backend_custom_domain.value' <<< "$outputs")"

          {
            echo "test_cognito_region=${AWS_REGION}"
            echo "test_cognito_user_pool_id=${cognito_user_pool_id}"
            echo "test_cognito_app_client_id=${cognito_app_client_id}"
            echo "test_trade_execution_queue_url=${trade_execution_queue_url}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Test infrastructure outputs"
            echo
            echo "| Name | Value |"
            echo "| --- | --- |"
            echo "| TEST_COGNITO_REGION | ${AWS_REGION} |"
            echo "| TEST_COGNITO_USER_POOL_ID | ${cognito_user_pool_id} |"
            echo "| TEST_COGNITO_APP_CLIENT_ID | ${cognito_app_client_id} |"
            echo "| TEST_TRADE_EXECUTION_QUEUE_URL | ${trade_execution_queue_url} |"
            echo "| VITE_COGNITO_REGION | ${AWS_REGION} |"
            echo "| VITE_COGNITO_USER_POOL_ID | ${cognito_user_pool_id} |"
            echo "| VITE_COGNITO_APP_CLIENT_ID | ${cognito_app_client_id} |"
            echo "| VITE_COGNITO_DOMAIN | ${cognito_domain} |"
            echo "| VITE_API_BASE_URL | ${backend_custom_domain} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "$GH_VARIABLES_TOKEN" ]]; then
            echo "GH_VARIABLES_TOKEN is not configured; wrote outputs to the job summary instead."
            exit 0
          fi

          export GH_TOKEN="$GH_VARIABLES_TOKEN"

          gh variable set TEST_COGNITO_REGION --env test --body "$AWS_REGION"
          gh variable set TEST_COGNITO_USER_POOL_ID --env test --body "$cognito_user_pool_id"
          gh variable set TEST_COGNITO_APP_CLIENT_ID --env test --body "$cognito_app_client_id"
          gh variable set TEST_TRADE_EXECUTION_QUEUE_URL --env test --body "$trade_execution_queue_url"

          gh variable set VITE_COGNITO_REGION --env test --body "$AWS_REGION"
          gh variable set VITE_COGNITO_USER_POOL_ID --env test --body "$cognito_user_pool_id"
          gh variable set VITE_COGNITO_APP_CLIENT_ID --env test --body "$cognito_app_client_id"
          gh variable set VITE_COGNITO_DOMAIN --env test --body "$cognito_domain"
          gh variable set VITE_API_BASE_URL --env test --body "$backend_custom_domain"

      - name: Sync trade execution queue worker market-hours state
        if: steps.trade-execution-queue-worker-changes.outputs.changed == 'true' && (github.ref == 'refs/heads/test' || github.event_name == 'workflow_dispatch')
        run: |
          aws lambda invoke \
            --function-name test-trade-execution-market-hours-controller \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"sync"}' \
            market-hours-sync-response.json

          cat market-hours-sync-response.json

  deploy-test-backend:
    needs: deploy-test-infrastructure
    runs-on: ubuntu-latest
    environment: test
    env:
      TF_VAR_trade_worker_image_uri: ${{ vars.TF_VAR_trade_worker_image_uri }}
      TF_VAR_opensearch_endpoint_override: ${{ vars.TF_VAR_opensearch_endpoint_override }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity for backend deployment
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure sensitive Terraform variables
        env:
          SANDBOX_ALPACA_BROKER_API_KEY: ${{ secrets.SANDBOX_ALPACA_BROKER_API_KEY }}
          SANDBOX_ALPACA_BROKER_API_SECRET: ${{ secrets.SANDBOX_ALPACA_BROKER_API_SECRET }}
        run: |
          set -euo pipefail

          if [[ -z "$SANDBOX_ALPACA_BROKER_API_KEY" || -z "$SANDBOX_ALPACA_BROKER_API_SECRET" ]]; then
            echo "SANDBOX_ALPACA_BROKER_API_KEY and SANDBOX_ALPACA_BROKER_API_SECRET must be configured for the test environment." >&2
            exit 1
          fi

          {
            echo "TF_VAR_trade_worker_environment<<EOF"
            jq -n \
              --arg sandbox_alpaca_broker_api_key "$SANDBOX_ALPACA_BROKER_API_KEY" \
              --arg sandbox_alpaca_broker_api_secret "$SANDBOX_ALPACA_BROKER_API_SECRET" \
              '{
                SANDBOX_ALPACA_BROKER_API_KEY: $sandbox_alpaca_broker_api_key,
                SANDBOX_ALPACA_BROKER_API_SECRET: $sandbox_alpaca_broker_api_secret
              }'
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Initialize Terraform
        run: |
          terraform -chdir=infrastructure_terraform/test init \
            -backend-config="bucket=trybaskt-terraform-state-499133675835" \
            -backend-config="key=baskt/test/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform -chdir=infrastructure_terraform/test validate -no-color

      - name: Resolve trade execution queue worker image URI
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          if [[ -n "${TF_VAR_trade_worker_image_uri:-}" ]]; then
            echo "Using configured trade worker image: $TF_VAR_trade_worker_image_uri"
            exit 0
          fi

          function_name="test-trade-execution-queue-worker"
          image_uri="$(
            aws lambda get-function \
              --function-name "$function_name" \
              --region "$AWS_REGION" \
              --query 'Code.ImageUri' \
              --output text 2>/dev/null || true
          )"

          if [[ -z "$image_uri" || "$image_uri" == "None" ]]; then
            echo "Unable to resolve the current trade worker image URI. Run the test infrastructure job first." >&2
            exit 1
          fi

          echo "Reusing current Lambda image: $image_uri"
          echo "TF_VAR_trade_worker_image_uri=$image_uri" >> "$GITHUB_ENV"

      - name: Build and push backend image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          repository_name="test-backend"
          repository_uri="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${repository_name}"
          image_uri="${repository_uri}:${GITHUB_SHA}"

          aws ecr describe-repositories \
            --repository-names "$repository_name" \
            --region "$AWS_REGION" >/dev/null

          if aws ecr describe-images \
            --repository-name "$repository_name" \
            --image-ids imageTag="$GITHUB_SHA" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Image $image_uri already exists; reusing it."
            echo "TF_VAR_backend_image_uri=$image_uri" >> "$GITHUB_ENV"
            exit 0
          fi

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          docker build \
            -f backend/Dockerfile \
            -t "$image_uri" \
            .

          docker push "$image_uri"

          echo "TF_VAR_backend_image_uri=$image_uri" >> "$GITHUB_ENV"

      - name: Update backend runtime secrets
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SANDBOX_ALPACA_BROKER_API_KEY: ${{ secrets.SANDBOX_ALPACA_BROKER_API_KEY }}
          SANDBOX_ALPACA_BROKER_API_SECRET: ${{ secrets.SANDBOX_ALPACA_BROKER_API_SECRET }}
        run: |
          set -euo pipefail

          aws secretsmanager put-secret-value \
            --secret-id test/backend/sandbox_alpaca_broker_api_key \
            --secret-string "$SANDBOX_ALPACA_BROKER_API_KEY" \
            --region "$AWS_REGION" >/dev/null

          aws secretsmanager put-secret-value \
            --secret-id test/backend/sandbox_alpaca_broker_api_secret \
            --secret-string "$SANDBOX_ALPACA_BROKER_API_SECRET" \
            --region "$AWS_REGION" >/dev/null

      - name: Plan backend ECS deployment
        run: terraform -chdir=infrastructure_terraform/test plan -target=module.backend_ecs -out=tfplan -no-color

      - name: Apply backend ECS deployment
        run: terraform -chdir=infrastructure_terraform/test apply -auto-approve tfplan

      - name: Wait for backend service stability
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws ecs wait services-stable \
            --cluster test-backend \
            --services test-backend \
            --region "$AWS_REGION"

      - name: Check backend health
        run: curl --fail --show-error --silent https://api-test.trybaskt.com/health

  deploy-test-frontend:
    needs: deploy-test-backend
    runs-on: ubuntu-latest
    environment: test
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      FRONTEND_BUCKET_NAME: test-frontend-v4
      FRONTEND_DOMAIN_NAME: test.trybaskt.com
      TF_VAR_trade_worker_image_uri: not-used-for-frontend-targeted-apply

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: |
          terraform -chdir=infrastructure_terraform/test init \
            -backend-config="bucket=trybaskt-terraform-state-499133675835" \
            -backend-config="key=baskt/test/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Provision frontend hosting
        run: |
          terraform -chdir=infrastructure_terraform/test plan \
            -target=module.frontend_hosting \
            -out=tfplan \
            -no-color

          terraform -chdir=infrastructure_terraform/test apply -auto-approve tfplan

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend_v4/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend_v4
        run: npm ci

      - name: Build test frontend
        working-directory: frontend_v4
        run: npm run build:test

      - name: Upload versioned frontend assets
        run: |
          aws s3 sync frontend_v4/dist "s3://${FRONTEND_BUCKET_NAME}" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload frontend entrypoint
        run: |
          aws s3 cp frontend_v4/dist/index.html "s3://${FRONTEND_BUCKET_NAME}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Resolve CloudFront distribution
        id: cloudfront
        run: |
          set -euo pipefail

          distribution_id="$(
            aws cloudfront list-distributions \
              --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '${FRONTEND_DOMAIN_NAME}')].Id | [0]" \
              --output text
          )"

          if [[ -z "$distribution_id" || "$distribution_id" == "None" ]]; then
            echo "Unable to find CloudFront distribution for ${FRONTEND_DOMAIN_NAME}." >&2
            exit 1
          fi

          echo "distribution_id=${distribution_id}" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cloudfront.outputs.distribution_id }}" \
            --paths "/*"

  run-backend-tests-live-alpaca:
    if: github.event.inputs.backend_test_mode == 'live_alpaca'
    needs:
      - deploy-test-infrastructure
      - deploy-test-frontend
    runs-on: ubuntu-latest
    environment: test
    env:
      ENV: test
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ALPACA_ENV: sandbox
      SANDBOX_ALPACA_BROKER_API_KEY: ${{ secrets.SANDBOX_ALPACA_BROKER_API_KEY }}
      SANDBOX_ALPACA_BROKER_API_SECRET: ${{ secrets.SANDBOX_ALPACA_BROKER_API_SECRET }}
      TEST_COGNITO_REGION: ${{ needs.deploy-test-infrastructure.outputs.test_cognito_region }}
      TEST_COGNITO_USER_POOL_ID: ${{ needs.deploy-test-infrastructure.outputs.test_cognito_user_pool_id }}
      TEST_COGNITO_APP_CLIENT_ID: ${{ needs.deploy-test-infrastructure.outputs.test_cognito_app_client_id }}
      TEST_TRADE_EXECUTION_QUEUE_URL: ${{ needs.deploy-test-infrastructure.outputs.test_trade_execution_queue_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          python -m pytest \
            backend/tests/test_account_lifecycle \
            backend/tests/test_model_portfolios_stocks_search \
            backend/tests/test_trade_execution_queuing_service \
            --junitxml=backend-test-results.xml

      - name: Publish backend test results
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          import xml.etree.ElementTree as ET

          def markdown_cell(value):
              return html.escape(value).replace("|", "\\|")

          report_path = Path("backend-test-results.xml")
          summary_path = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])

          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("\n## Backend test results\n\n")

              if not report_path.exists():
                  summary.write("No backend test report was generated.\n")
                  raise SystemExit(0)

              root = ET.parse(report_path).getroot()
              test_cases = root.findall(".//testcase")

              summary.write("| Test case | Result | Error message |\n")
              summary.write("| --- | --- | --- |\n")

              for test_case in test_cases:
                  class_name = test_case.attrib.get("classname", "")
                  test_name = test_case.attrib.get("name", "")
                  full_name = f"{class_name}.{test_name}" if class_name else test_name

                  failure = test_case.find("failure")
                  error = test_case.find("error")
                  skipped = test_case.find("skipped")

                  if failure is not None:
                      result = "failed"
                      message = failure.attrib.get("message") or failure.text or ""
                  elif error is not None:
                      result = "error"
                      message = error.attrib.get("message") or error.text or ""
                  elif skipped is not None:
                      result = "skipped"
                      message = skipped.attrib.get("message") or skipped.text or ""
                  else:
                      result = "passed"
                      message = ""

                  message = " ".join(message.split())
                  if len(message) > 500:
                      message = f"{message[:497]}..."

                  summary.write(
                      f"| {markdown_cell(full_name)} "
                      f"| {markdown_cell(result)} "
                      f"| {markdown_cell(message)} |\n"
                  )
          PY

  run-backend-tests-mock-alpaca:
    if: github.event.inputs.backend_test_mode == 'mock_alpaca'
    needs:
      - deploy-test-infrastructure
      - deploy-test-frontend
    runs-on: ubuntu-latest
    environment: test
    env:
      ENV: test
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ALPACA_ENV: sandbox
      SANDBOX_ALPACA_BROKER_API_KEY: ${{ secrets.SANDBOX_ALPACA_BROKER_API_KEY }}
      SANDBOX_ALPACA_BROKER_API_SECRET: ${{ secrets.SANDBOX_ALPACA_BROKER_API_SECRET }}
      TEST_COGNITO_REGION: ${{ needs.deploy-test-infrastructure.outputs.test_cognito_region }}
      TEST_COGNITO_USER_POOL_ID: ${{ needs.deploy-test-infrastructure.outputs.test_cognito_user_pool_id }}
      TEST_COGNITO_APP_CLIENT_ID: ${{ needs.deploy-test-infrastructure.outputs.test_cognito_app_client_id }}
      TEST_TRADE_EXECUTION_QUEUE_URL: ${{ needs.deploy-test-infrastructure.outputs.test_trade_execution_queue_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests with mock Alpaca
        run: |
          python -m pytest \
            backend/tests/test_account_lifecycle \
            backend/tests/test_model_portfolios_stocks_search \
            backend/tests/test_trade_execution_queuing_service \
            --mock_alpaca \
            --junitxml=backend-test-results-mock-alpaca.xml

      - name: Publish mock Alpaca backend test results
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          import xml.etree.ElementTree as ET

          def markdown_cell(value):
              return html.escape(value).replace("|", "\\|")

          report_path = Path("backend-test-results-mock-alpaca.xml")
          summary_path = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])

          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("\n## Backend test results - mock Alpaca\n\n")

              if not report_path.exists():
                  summary.write("No backend test report was generated.\n")
                  raise SystemExit(0)

              root = ET.parse(report_path).getroot()
              test_cases = root.findall(".//testcase")

              summary.write("| Test case | Result | Error message |\n")
              summary.write("| --- | --- | --- |\n")

              for test_case in test_cases:
                  class_name = test_case.attrib.get("classname", "")
                  test_name = test_case.attrib.get("name", "")
                  full_name = f"{class_name}.{test_name}" if class_name else test_name

                  failure = test_case.find("failure")
                  error = test_case.find("error")
                  skipped = test_case.find("skipped")

                  if failure is not None:
                      result = "failed"
                      message = failure.attrib.get("message") or failure.text or ""
                  elif error is not None:
                      result = "error"
                      message = error.attrib.get("message") or error.text or ""
                  elif skipped is not None:
                      result = "skipped"
                      message = skipped.attrib.get("message") or skipped.text or ""
                  else:
                      result = "passed"
                      message = ""

                  message = " ".join(message.split())
                  if len(message) > 500:
                      message = f"{message[:497]}..."

                  summary.write(
                      f"| {markdown_cell(full_name)} "
                      f"| {markdown_cell(result)} "
                      f"| {markdown_cell(message)} |\n"
                  )
          PY
