name: Deploy Test Backend to ECS

on:
  push:
    branches:
      - test
    paths:
      - "backend/**"
      - "infrastructure_terraform/test/**"
      - ".github/workflows/deploy_backend_test_workflow.yml"
  workflow_dispatch:

concurrency:
  group: test-aws-environment
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-test-backend:
    if: github.ref == 'refs/heads/test' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: test
    env:
      TF_VAR_trade_worker_image_uri: ${{ vars.TF_VAR_trade_worker_image_uri }}
      TF_VAR_opensearch_endpoint_override: ${{ vars.TF_VAR_opensearch_endpoint_override }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity for backend deployment
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure sensitive Terraform variables
        env:
          SANDBOX_ALPACA_BROKER_API_KEY: ${{ secrets.SANDBOX_ALPACA_BROKER_API_KEY }}
          SANDBOX_ALPACA_BROKER_API_SECRET: ${{ secrets.SANDBOX_ALPACA_BROKER_API_SECRET }}
        run: |
          set -euo pipefail

          if [[ -z "$SANDBOX_ALPACA_BROKER_API_KEY" || -z "$SANDBOX_ALPACA_BROKER_API_SECRET" ]]; then
            echo "SANDBOX_ALPACA_BROKER_API_KEY and SANDBOX_ALPACA_BROKER_API_SECRET must be configured for the test environment." >&2
            exit 1
          fi

          {
            echo "TF_VAR_trade_worker_environment<<EOF"
            jq -n \
              --arg sandbox_alpaca_broker_api_key "$SANDBOX_ALPACA_BROKER_API_KEY" \
              --arg sandbox_alpaca_broker_api_secret "$SANDBOX_ALPACA_BROKER_API_SECRET" \
              '{
                SANDBOX_ALPACA_BROKER_API_KEY: $sandbox_alpaca_broker_api_key,
                SANDBOX_ALPACA_BROKER_API_SECRET: $sandbox_alpaca_broker_api_secret
              }'
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Initialize Terraform
        run: |
          terraform -chdir=infrastructure_terraform/test init \
            -backend-config="bucket=trybaskt-terraform-state-499133675835" \
            -backend-config="key=baskt/test/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform -chdir=infrastructure_terraform/test validate -no-color

      - name: Resolve trade execution queue worker image URI
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          if [[ -n "${TF_VAR_trade_worker_image_uri:-}" ]]; then
            echo "Using configured trade worker image: $TF_VAR_trade_worker_image_uri"
            exit 0
          fi

          function_name="test-trade-execution-queue-worker"
          image_uri="$(
            aws lambda get-function \
              --function-name "$function_name" \
              --region "$AWS_REGION" \
              --query 'Code.ImageUri' \
              --output text 2>/dev/null || true
          )"

          if [[ -z "$image_uri" || "$image_uri" == "None" ]]; then
            echo "Unable to resolve the current trade worker image URI. Run the test infrastructure workflow first." >&2
            exit 1
          fi

          echo "Reusing current Lambda image: $image_uri"
          echo "TF_VAR_trade_worker_image_uri=$image_uri" >> "$GITHUB_ENV"

      - name: Build and push backend image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          repository_name="test-backend"
          repository_uri="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${repository_name}"
          image_uri="${repository_uri}:${GITHUB_SHA}"

          aws ecr describe-repositories \
            --repository-names "$repository_name" \
            --region "$AWS_REGION" >/dev/null

          if aws ecr describe-images \
            --repository-name "$repository_name" \
            --image-ids imageTag="$GITHUB_SHA" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Image $image_uri already exists; reusing it."
            echo "TF_VAR_backend_image_uri=$image_uri" >> "$GITHUB_ENV"
            exit 0
          fi

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          docker build \
            -f backend/Dockerfile \
            -t "$image_uri" \
            .

          docker push "$image_uri"

          echo "TF_VAR_backend_image_uri=$image_uri" >> "$GITHUB_ENV"

      - name: Update backend runtime secrets
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SANDBOX_ALPACA_BROKER_API_KEY: ${{ secrets.SANDBOX_ALPACA_BROKER_API_KEY }}
          SANDBOX_ALPACA_BROKER_API_SECRET: ${{ secrets.SANDBOX_ALPACA_BROKER_API_SECRET }}
        run: |
          set -euo pipefail

          aws secretsmanager put-secret-value \
            --secret-id test/backend/sandbox_alpaca_broker_api_key \
            --secret-string "$SANDBOX_ALPACA_BROKER_API_KEY" \
            --region "$AWS_REGION" >/dev/null

          aws secretsmanager put-secret-value \
            --secret-id test/backend/sandbox_alpaca_broker_api_secret \
            --secret-string "$SANDBOX_ALPACA_BROKER_API_SECRET" \
            --region "$AWS_REGION" >/dev/null

      - name: Plan backend ECS deployment
        run: terraform -chdir=infrastructure_terraform/test plan -target=module.backend_ecs -out=tfplan -no-color

      - name: Apply backend ECS deployment
        run: terraform -chdir=infrastructure_terraform/test apply -auto-approve tfplan

      - name: Wait for backend service stability
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws ecs wait services-stable \
            --cluster test-backend \
            --services test-backend \
            --region "$AWS_REGION"

      - name: Check backend health
        run: curl --fail --show-error --silent https://api-test.trybaskt.com/health
